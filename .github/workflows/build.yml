name: Build LittleLock

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore littlelock-release.keystore \
            -storepass littlelock123 \
            -keypass littlelock123 \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias littlelock \
            -dname "CN=LittlesLock, OU=Dev, O=LittlesLock, L=City, ST=State, C=US"

      - name: Run Tests
        run: ./gradlew test

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LittleLock-release
          path: app/build/outputs/apk/release/LittleLock-release.apk
