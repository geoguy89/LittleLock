name: Build LittleLock

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  release:
    types: [ published ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Run Tests
        run: ./gradlew test

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Decode Keystore (if available)
        id: decode_keystore
        if: secrets.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > littlelock-release.keystore
          echo "keystore_decoded=true" >> $GITHUB_OUTPUT

      - name: Sign APK
        if: steps.decode_keystore.outputs.keystore_decoded == 'true'
        run: |
          jarsigner -verbose -sigalg SHA1withRSA -digestalg SHA1 \
            -keystore littlelock-release.keystore \
            -storepass "${{ secrets.ANDROID_STORE_PASSWORD }}" \
            -keypass "${{ secrets.ANDROID_KEY_PASSWORD }}" \
            app/build/outputs/apk/release/LittleLock-release.apk \
            littlelock

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LittleLock-release
          path: app/build/outputs/apk/release/LittleLock-release.apk

      - name: Upload Release Asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/outputs/apk/release/LittleLock-release.apk
